<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Reward Sobat Bayer 2026</title>
    <style>
        :root {
            --primary: #0089ff;
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .main-card {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            padding: 20px;
        }

        .header { text-align: center; border-bottom: 2px solid #eee; margin-bottom: 20px; padding-bottom: 10px; }
        .header h2 { margin: 0; color: var(--primary); font-size: 1.3rem; }

        label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 10px; color: #666; }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid #ddd;
            font-size: 1rem;
            outline: none;
            background: #fff;
        }

        #display-info {
            display: none;
            margin-top: 25px;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .data-label { color: #888; font-size: 0.9rem; }
        .data-value { font-weight: 600; color: var(--text); }

        .final-reward-box {
            background: linear-gradient(135deg, #0089ff, #0056b3);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-top: 20px;
        }

        .final-reward-box small { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
        .final-reward-box div { font-size: 1.8rem; font-weight: 800; margin-top: 5px; }

        .group-badge {
            display: inline-block;
            background: #e1f5fe;
            color: #01579b;
            padding: 2px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="main-card">
    <div class="header">
        <h2>Reward Sobat 2026</h2>
    </div>

    <label>PILIH ITEM PRODUK:</label>
    <select id="prodPicker" onchange="updateView()">
        <option value="">-- Lihat Daftar Produk --</option>
    </select>

    <div id="display-info">
        <div id="v-group" class="group-badge">GROUP -</div>
        <div class="data-row"><span class="data-label">Point R1</span><span id="v-r1" class="data-value">-</span></div>
        <div class="data-row"><span class="data-label">Point R2</span><span id="v-r2" class="data-value">-</span></div>
        <div class="data-row"><span class="data-label">Reward Sobat</span><span id="v-reward" class="data-value">-</span></div>
        <div class="data-row"><span class="data-label">Pajak Sobat (6%)</span><span id="v-tax" class="data-value">-</span></div>
        
        <div class="final-reward-box">
            <small>Final Reward Sobat</small>
            <div id="v-final">-</div>
        </div>
    </div>
</div>

const view = document.getElementById('display-info');

// Urutkan alfabetis & masukkan ke dropdown
dataset.sort((a,b) => a.n.localeCompare(b.n)).forEach((item, i) => {
    let opt = document.createElement('option');
    opt.value = i;
    opt.innerText = item.n;
    picker.appendChild(opt);
});

function updateView() {
    const idx = picker.value;
    if(idx === "") {
        view.style.display = 'none';
        return;
    }

    const d = dataset[idx];
    view.style.display = 'block';
    document.getElementById('v-group').innerText = "GROUP " + d.g;
    document.getElementById('v-r1').innerText = d.r1;
    document.getElementById('v-r2').innerText = d.r2;
    document.getElementById('v-reward').innerText = d.rw;
    document.getElementById('v-tax').innerText = d.tx;
    document.getElementById('v-final').innerText = d.f;
